name: Build

on:
  pull_request:
  # Очередь слияния (ruleset master) проверяет PR на этом событии; без него Build в очереди не запустится
  merge_group:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: "Directory.Packages.props"

    - name: Restore
      run: dotnet restore

    - name: Format
      run: dotnet format --no-restore --verify-no-changes --severity warn

    - name: Build
      run: dotnet build --no-restore -c Release

    # Тесты используют TUnit на Microsoft.Testing.Platform (MTP), а не VSTest.
    # MTP-режим dotnet test включён секцией "test" в global.json; аргументы платформы
    # тестирования отделяются "--", чтобы парсер не путал их с аргументами dotnet test.
    # Отдельный отчёт не нужен: TUnit сам пишет сводку прогона в summary job'а
    # (GITHUB_STEP_SUMMARY), а упавший тест и так валит этот шаг.
    # Каталог результатов задан явно: оттуда HTML-отчёт TUnit забирает следующий шаг.
    - name: Test
      run: dotnet test -c Release --no-build -- --results-directory ./TestResults

    - name: Save test results to artifacts
      uses: actions/upload-artifact@v7  # HTML-отчёт TUnit
      if: success() || failure()        # и при упавших тестах тоже
      with:
        name: test-results
        path: TestResults

