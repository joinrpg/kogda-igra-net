name: Build

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      actions: write

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: "Directory.Packages.props"

    - name: Restore
      run: dotnet restore

    - name: Format
      run: dotnet format --no-restore --verify-no-changes --severity warn

    - name: Build
      run: dotnet build --no-restore -c Release

    # Тесты используют TUnit на Microsoft.Testing.Platform (MTP), а не VSTest.
    # MTP-режим dotnet test включён секцией "test" в global.json; аргументы платформы
    # тестирования отделяются "--", чтобы парсер не путал их с аргументами dotnet test.
    # Опцию --report-trx даёт пакет Microsoft.Testing.Extensions.TrxReport.
    - name: Test
      run: dotnet test -c Release --no-build -- --report-trx --report-trx-filename results.trx --results-directory ./TestResults

    - name: Save test results to artifacts
      uses: actions/upload-artifact@v7  # upload test results
      if: success() || failure()        # run this step even if previous step failed
      with:
        name: test-results
        path: TestResults

  report:
    runs-on: ubuntu-24.04
    needs: build
    if: always()
    permissions:
      checks: write
    steps:
      - uses: dorny/test-reporter@v3.0.0
        with:
          artifact: test-results # artifact name
          name: Tests                       # Name of the check run which will be created
          path: '*.trx'                     # Path to test results (inside artifact .zip)
          reporter: dotnet-trx              # Format of test results
