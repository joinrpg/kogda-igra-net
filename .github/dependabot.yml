version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      net:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "System.Text.Json"
          - "System.Net.Http.Json"
      tunit:
        patterns:
          - "TUnit*"
      testcontainers:
        patterns:
          - "Testcontainers.*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
